name: Playwright E2E

on:
  push:
    branches: [ main, chore/docs-ghana-english ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: kiyumart
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers & OS deps
        run: npx playwright install --with-deps

      - name: Start backend (server)
        env:
          SESSION_SECRET: testsecret
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiyumart
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGPORT: 5432
          PGDATABASE: kiyumart
          NODE_ENV: test
        run: |
          nohup bash -lc "SESSION_SECRET=$SESSION_SECRET DATABASE_URL=$DATABASE_URL npx tsx server/index.ts > server-ci.log 2>&1 &" 

      - name: Wait for backend
        run: npx wait-on http://localhost:5000/api/health --timeout 60000

      - name: Seed database
        env:
          SESSION_SECRET: testsecret
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiyumart
        run: npx tsx server/seed.ts || true

      - name: Start frontend (Vite)
        run: |
          nohup npm run dev:frontend > vite-ci.log 2>&1 &

      - name: Wait for frontend
        run: npx wait-on http://localhost:5173 --timeout 60000

      - name: Run Playwright tests
        env:
          SESSION_SECRET: testsecret
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiyumart
        run: npx playwright test --reporter=github --retries=2
        continue-on-error: false

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report || .
