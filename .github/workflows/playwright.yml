name: Playwright E2E

on:
  push:
    branches: [ main, chore/docs-ghana-english ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: kiyumart
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SESSION_SECRET: ci-only-playwright
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kiyumart
      AUTO_MAINTENANCE_DURATION_MS: '0'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Initialize disposable test database
        run: npx drizzle-kit push --force
      - name: Run browser tests
        run: npx playwright test --reporter=github
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
