name: Playwright E2E

on:
  push:
    branches: [ main, chore/docs-ghana-english ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kiyumart
      SESSION_SECRET: ci-only-e2e-secret
      NODE_ENV: test
      AUTO_MAINTENANCE_DURATION_MS: '0'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: kiyumart
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: node scripts/typecheck-safe.mjs

      - name: Install Playwright browsers & OS deps
        run: npx playwright install --with-deps chromium

      - name: Prepare isolated test database schema
        run: npx drizzle-kit push --force

      - name: Seed isolated test database
        run: npx tsx server/seed.ts

      - name: Start backend (server)
        run: |
          npx tsx server/index.ts > server-ci.log 2>&1 &
          echo $! > server-ci.pid

      - name: Wait for backend (show startup errors on failure)
        run: |
          if ! npx wait-on http://127.0.0.1:5000/api/health --timeout 60000; then
            echo "Backend startup failed. Sanitized startup diagnostics:"
            sed -E 's#postgresql://[^[:space:]]+#postgresql://[REDACTED]#g' server-ci.log | tail -n 70
            exit 1
          fi

      - name: Start frontend (Vite)
        run: |
          nohup npx vite --host 0.0.0.0 > vite-ci.log 2>&1 &

      - name: Wait for frontend
        run: npx wait-on http://localhost:5173 --timeout 60000

      - name: Run Playwright tests
        env:
          SESSION_SECRET: testsecret
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiyumart
        run: npx playwright test --reporter=github --retries=2
        continue-on-error: false

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
