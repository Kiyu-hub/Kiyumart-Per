name: Keep backend awake

# Render's free tier spins the service down after ~15 min of inactivity, which
# causes a ~30s-2min cold start for the next visitor. This workflow pings the
# backend health endpoint on a schedule so it stays warm during the day.
#
# Notes:
# - GitHub's scheduled runs can be delayed under load, so we ping a couple of
#   times per run to smooth that out.
# - GitHub auto-disables cron workflows after 60 days with no repo activity;
#   any push re-enables it. For guaranteed uptime, an external pinger
#   (cron-job.org / UptimeRobot hitting the same URL) is more reliable.

on:
  schedule:
    - cron: "*/14 * * * *"   # every 14 minutes (just under Render's 15-min idle window)
  workflow_dispatch: {}       # allow manual "Run workflow" from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          URL="https://kiyumart-api.onrender.com/api/health"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$URL" || echo "000")
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is awake."
              exit 0
            fi
            sleep 20
          done
          echo "Backend did not return 200 after 3 attempts (it may still be cold-starting)."
          # Do not fail the workflow on a cold start — the ping itself wakes it.
          exit 0
