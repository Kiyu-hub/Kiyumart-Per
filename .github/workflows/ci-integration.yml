name: Paystack integration (optional)

# Talks to the real Paystack test API, so it only runs when the repository
# secret RUN_PAYSTACK_INTEGRATION is "true" (and test keys are configured).
# The regular unit tests run in ci.yml.

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Paystack integration test
        env:
          SESSION_SECRET: testsecret
          RUN_PAYSTACK_INTEGRATION: ${{ secrets.RUN_PAYSTACK_INTEGRATION }}
        run: |
          if [ "${RUN_PAYSTACK_INTEGRATION}" = "true" ]; then
            node scripts/run-tsx-test-suite-safe.mjs server/__tests__/paystack-integration.test.ts
          else
            echo "Skipped (set the RUN_PAYSTACK_INTEGRATION secret to 'true' to enable)."
          fi
