name: CI integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SESSION_SECRET: ci-only-local-secret
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      AUTO_MAINTENANCE_DURATION_MS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit suite
        run: node scripts/run-tsx-test-suite-safe.mjs
      - name: Run optional Paystack integration tests
        env:
          RUN_PAYSTACK_INTEGRATION: ${{ secrets.RUN_PAYSTACK_INTEGRATION }}
        run: |
          if [ "$RUN_PAYSTACK_INTEGRATION" = "true" ]; then
            node scripts/run-tsx-test-suite-safe.mjs server/__tests__/paystack-integration.test.ts
          else
            echo "Paystack integration intentionally skipped until test-mode setup"
          fi
