name: CI Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SESSION_SECRET: ci-only-kiyumart-integration
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      AUTO_MAINTENANCE_DURATION_MS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run existing server unit tests
        run: node scripts/run-tsx-test-suite-safe.mjs
      - name: Run Paystack integration tests (opt-in only)
        if: ${{ vars.RUN_PAYSTACK_INTEGRATION == 'true' }}
        run: node scripts/run-tsx-test-suite-safe.mjs server/__tests__/paystack-integration.test.ts
