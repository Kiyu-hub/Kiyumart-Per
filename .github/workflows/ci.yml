name: CI

# Required check: TypeScript, all server tests and the production build.
# Server tests use stubbed storage and fake records, so no database or real
# Paystack keys are needed. Browser (Playwright) tests run in playwright.yml.

on:
  push:
    branches: [ main, preview ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SESSION_SECRET: testsecret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiyumart
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: node scripts/typecheck-safe.mjs

      - name: Server tests
        run: node scripts/run-tsx-test-suite-safe.mjs

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
