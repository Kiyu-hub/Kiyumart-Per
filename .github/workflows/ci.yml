name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SESSION_SECRET: ci-only-local-secret
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      AUTO_MAINTENANCE_DURATION_MS: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run server unit tests
        run: node scripts/run-tsx-test-suite-safe.mjs

      - name: TypeScript typecheck
        run: npx tsc --noEmit --pretty false

      - name: Build frontend and server bundles
        run: npm run build

# Browser E2E tests run in the dedicated playwright.yml workflow,
# which provisions PostgreSQL. This workflow must not use production credentials.
