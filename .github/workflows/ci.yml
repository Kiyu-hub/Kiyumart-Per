name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SESSION_SECRET: ci-only-local-secret
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      AUTO_MAINTENANCE_DURATION_MS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run server unit tests
        run: node scripts/run-tsx-test-suite-safe.mjs
      - name: TypeScript check
        run: npx tsc --noEmit --pretty false
      - name: Build release bundles
        run: npm run build

# Browser E2E coverage runs separately with isolated PostgreSQL in playwright.yml.
