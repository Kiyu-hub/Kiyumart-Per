<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />

    <!-- PWA / Theme — default white so no colored bar appears before platform settings load -->
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/api/public/app-manifest" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" keeps the native iOS status bar; avoids content bleeding under bar -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KiyuMart" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/pwa-192x192.png" />

    <!-- MS Tiles (Windows) -->
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- SEO -->
    <title>KiyuMart - Your Fashion Marketplace</title>
    <meta name="description" content="Discover fashion at KiyuMart. Shop the latest trends in clothing, shoes, and accessories with fast delivery across Ghana." />
    <meta name="keywords" content="fashion, clothing, shopping, Ghana, marketplace, delivery" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KiyuMart - Your Fashion Marketplace" />
    <meta property="og:description" content="Shop the latest trends with fast delivery across Ghana." />
    <meta property="og:image" content="/icons/pwa-512x512.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Preload critical assets -->
    <link rel="preload" as="image" href="/attached_assets/kiyumart_logo_dark.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
