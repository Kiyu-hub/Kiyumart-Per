<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>KiyuMart • Fashion Test Catalogue</title>
<style>
:root{font-family:Inter,Arial,sans-serif;background:#f7f6f3;color:#222}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}header{position:sticky;top:0;z-index:4;background:#fbfaf9;padding:14px 18px;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between}header strong{font-size:21px;letter-spacing:-.6px}header b,.teal{color:#009688}header small{font-size:11px;color:#777}.notice{background:#e7f4f1;color:#245f54;text-align:center;padding:11px;font-size:12px}main{max-width:540px;margin:auto}.catalog{padding:22px 16px}.catalog h1{font-size:27px;letter-spacing:-.8px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{border:0;border-radius:14px;overflow:hidden;background:#fff;text-align:left;padding:0;box-shadow:0 1px 9px #0001}.card img{display:block;width:100%;height:235px;object-fit:contain;background:#e8e6e2}.card span{display:block;padding:12px;font-size:13px;font-weight:700}.card small{display:block;color:#777;margin-top:5px;font-weight:400}.detail{display:none}.hero{height:min(80dvh,720px);min-height:400px;position:relative;background:#e7e5e1}.hero img{width:100%;height:100%;object-fit:contain;display:block}.hero .back{position:absolute;top:18px;left:16px}.arrows{position:absolute;top:50%;transform:translateY(-50%);left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.round{background:#fffffff0;border:0;border-radius:50%;height:46px;width:46px;box-shadow:0 3px 13px #0002;font-size:24px;pointer-events:auto}.counter{position:absolute;right:16px;bottom:34px;border-radius:30px;padding:6px 10px;background:#fffffff0;font-size:12px}.information{position:relative;margin-top:-20px;border-radius:20px 20px 0 0;background:#f7f6f3;padding:23px 19px 140px}.kicker{font-size:10px;font-weight:800;letter-spacing:1.8px;color:#009688}.information h2{font-size:25px;line-height:1.2}.muted{color:#777;font-size:13px;line-height:1.7}.row{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px;font-size:13px}.options{display:flex;flex-wrap:wrap;gap:9px}.option{border:1px solid #ccc;background:transparent;min-width:54px;min-height:46px;border-radius:9px}.option[aria-pressed=true]{background:#009688;color:#fff;border-color:#009688}.line{display:block;text-align:left;width:100%;padding:17px 0;border:0;border-top:1px solid #ddd;background:none;font-weight:600}.sticky{position:fixed;bottom:0;left:0;right:0;margin:auto;max-width:540px;background:#f7f6f3;padding:14px 18px max(14px,env(safe-area-inset-bottom));display:none;z-index:3;border-top:1px solid #ddd}.sticky button{width:100%;background:#009688;color:#fff;border:0;border-radius:11px;min-height:50px;font-weight:700}.sheet{position:fixed;inset:0;background:#0008;display:none;align-items:end;z-index:6}.sheet article{margin:auto;width:100%;max-width:540px;border-radius:22px 22px 0 0;background:#f7f6f3;padding:24px 20px 40px}.sheet button{float:right;border:0;border-radius:40px;background:#ddd;padding:8px 13px}
</style></head><body>
<header><strong>Kiyu<b>Mart</b></strong><small>Fashion preview • isolated test</small></header><div class="notice">Photography-based sample listings only. No live products, orders or payments.</div>
<main><section class="catalog" id="catalog"><h1>Fashion gallery testing</h1><p class="muted">Tap a product to try the full-image experience, centred gallery arrows, size selection and details sheet.</p><div class="cards" id="cards"></div></section><section class="detail" id="detail"><div class="hero" id="hero"><img id="photo" alt="Fashion product photograph"><button class="round back" onclick="goBack()" aria-label="Back to test catalogue">‹</button><div class="arrows"><button class="round" onclick="step(-1)" aria-label="Previous photograph">‹</button><button class="round" onclick="step(1)" aria-label="Next photograph">›</button></div><div class="counter" id="counter"></div></div><div class="information"><div class="kicker">KIYUMART • PRODUCT PREVIEW</div><h2 id="name"></h2><p class="muted" id="description"></p><div class="row"><b>Colour</b><span id="selectedColor"></span></div><div class="options" id="colors"></div><div class="row"><b>Choose size</b><button onclick="showSheet('size')" style="color:#009688;border:0;background:none;text-decoration:underline">Size guide ↗</button></div><div class="options" id="sizes"></div><div style="margin-top:26px"><button class="line" onclick="showSheet('details')">Product details & care　＋</button><button class="line" onclick="showSheet('size')">Size & fit　↗</button></div></div></section></main><div class="sticky" id="sticky"><button onclick="alert('Preview only: adding to cart and checkout are disabled.')">Test Add to Cart</button></div><div class="sheet" id="sheet" onclick="hideSheet()"><article onclick="event.stopPropagation()"><button onclick="hideSheet()" aria-label="Close">×</button><h2 id="sheetTitle"></h2><p class="muted" id="sheetDescription"></p></article></div>
<script>
const photos=[
'https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=max&w=1400&q=85',
'https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=max&w=1400&q=85',
'https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=max&w=1400&q=85'
];
const products=[
{name:'Contemporary Streetwear',subtitle:'Fashion editorial photography',photos:[photos[0],photos[2]],sizes:['S','M','L','XL'],colors:['Black','Beige'],description:'Sample fashion listing for testing image framing, colour and size selection. Not for sale.'},
{name:'Modern Everyday Outfit',subtitle:'Casual fashion photography',photos:[photos[1],photos[0]],sizes:['XS','S','M','L'],colors:['Cream','Navy'],description:'Example listing with a full-height photograph and variants. The sample is not connected to inventory.'},
{name:'Editorial Fashion Look',subtitle:'Fashion photography',photos:[photos[2],photos[1]],sizes:['S','M','L'],colors:['Black','White'],description:'A photo-led design test. The listing does not represent a stocked or priced product.'}
];
let current=0,selected=0;const el=id=>document.getElementById(id);
function goBack(){el('catalog').style.display='block';el('detail').style.display='none';el('sticky').style.display='none';scrollTo(0,0)}
function openProduct(i){current=i;selected=0;const p=products[i];el('catalog').style.display='none';el('detail').style.display='block';el('sticky').style.display='block';el('name').textContent=p.name;el('description').textContent=p.description;draw();renderOptions('colors',p.colors);renderOptions('sizes',p.sizes);scrollTo(0,0)}
function draw(){const p=products[current];el('photo').src=p.photos[selected];el('photo').alt=p.name;el('counter').textContent=(selected+1)+' / '+p.photos.length}
function step(direction){selected=(selected+direction+products[current].photos.length)%products[current].photos.length;draw()}
function renderOptions(id,items){el(id).replaceChildren(...items.map((item,i)=>{const b=document.createElement('button');b.className='option';b.textContent=item;b.setAttribute('aria-pressed',String(i===0));b.onclick=()=>{for(const x of el(id).children)x.setAttribute('aria-pressed',String(x===b));if(id==='colors')el('selectedColor').textContent=item};return b}));if(id==='colors')el('selectedColor').textContent=items[0]}
function showSheet(which){const p=products[current];el('sheet').style.display='flex';el('sheetTitle').textContent=which==='size'?'Size & fit':'Product details';el('sheetDescription').textContent=which==='size'?'Illustrative sizes: '+p.sizes.join(', ')+'. Actual measurements require seller information.':p.description}
function hideSheet(){el('sheet').style.display='none'}
el('cards').replaceChildren(...products.map((p,i)=>{const b=document.createElement('button');b.className='card';const img=document.createElement('img');img.src=p.photos[0];img.alt=p.name;const label=document.createElement('span');label.textContent=p.name;const sub=document.createElement('small');sub.textContent=p.subtitle;label.appendChild(sub);b.append(img,label);b.onclick=()=>openProduct(i);return b}));
</script></body></html>
