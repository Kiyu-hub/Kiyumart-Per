[build]
  base = "."
  command = "npm run build:frontend"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"
  FRONTEND_URL = "https://kiyumart1.netlify.app"

# NOTE: Netlify evaluates redirects top-to-bottom and applies the FIRST match.
# All backend proxy rules MUST come before the SPA catch-all (/*), otherwise the
# catch-all serves index.html for asset/API requests (broken banner images, etc).

# Redirect API calls to your backend server
[[redirects]]
  from = "/api/*"
  to = "https://kiyumart-api.onrender.com/api/:splat"
  status = 200
  force = true

# Serve attached_assets from backend (must precede the SPA fallback below)
[[redirects]]
  from = "/attached_assets/*"
  to = "https://kiyumart-api.onrender.com/attached_assets/:splat"
  status = 200
  force = true

# Locally-persisted upload fallback (used only when Cloudinary is unavailable).
# NOTE: Render's disk is ephemeral, so these files do not survive a restart —
# Cloudinary remains the durable store. This proxy keeps the fallback reachable.
[[redirects]]
  from = "/uploads/*"
  to = "https://kiyumart-api.onrender.com/uploads/:splat"
  status = 200
  force = true

# A code file from an older release that no longer exists must answer 404, not
# the start page (HTML served as JavaScript hides the problem). Existing files
# are served normally because this rule is not forced.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# SPA fallback - all remaining routes go to index.html (MUST stay last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Release safety: the start page and service worker must never be served stale,
# otherwise phones keep asking for code files from the previous release.
# Code files under /assets/ have content-hashed names, so they can cache forever.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
