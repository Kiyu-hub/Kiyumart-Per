<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KiyuMart wishlist — empty</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}button{font-family:inherit}</style></helmet>
<div style="width: 390px; min-height: 1060px; position: relative; box-sizing: border-box; background: #F2F2F7; color: #0D0D0D; font-family: -apple-system, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, sans-serif; padding-bottom: 96px">
  <header style="display: flex; align-items: center; gap: 8px; padding: 14px 12px 10px; background: #FFFFFF">
    <button aria-label="Back" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #F2F2F7; display: grid; place-items: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D0D0D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div style="flex: 1; font-size: 20px; font-weight: 800">Wishlist</div>
  </header>

  <section style="margin: 12px 12px 0; background: #FFFFFF; border-radius: 20px; padding: 28px 20px 20px; text-align: center">
    <div style="width: 96px; height: 96px; border-radius: 48px; background: #E0F2F1; display: grid; place-items: center; margin: 0 auto 16px">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#00796B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
    </div>
    <div style="font-size: 20px; font-weight: 800; margin-bottom: 6px">Your wishlist is empty</div>
    <div style="font-size: 14px; color: #5F6368; line-height: 1.5; margin-bottom: 20px">Tap the heart on any product to save it here.</div>
    <button style="height: 52px; width: 100%; border: 0; border-radius: 26px; background: #00796B; color: #FFFFFF; font-size: 16px; font-weight: 800; cursor: pointer">Start shopping</button>
  </section>

  <section style="margin-top: 22px; padding: 0 12px">
    <div style="font-size: 16px; font-weight: 800; padding: 0 4px 10px">Popular right now</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
      <sc-for list="{{picks}}" as="p" hint-placeholder-count="4">
        <article style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
          <div style="position: relative">
            <img src="{{p.img}}" alt="{{p.name}}" style="width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; background: #F5F5F7">
            <span style="position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 800; letter-spacing: 0.2px; color: #FFFFFF; background: #EF4444; border-radius: 6px; padding: 3px 7px">{{p.off}}</span>
            <button onClick="{{p.toggle}}" aria-label="Save {{p.name}}" style="position: absolute; top: 6px; right: 6px; width: 36px; height: 36px; border: 0; border-radius: 18px; background: rgba(255,255,255,0.92); display: grid; place-items: center; cursor: pointer">
              <sc-if value="{{p.saved}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="#E53935" stroke="#E53935" stroke-width="1.8" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></sc-if>
              <sc-if value="{{p.unsaved}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3C4043" stroke-width="1.8" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></sc-if>
            </button>
          </div>
          <div style="padding: 8px 10px 10px">
            <div style="font-size: 13px; font-weight: 600; line-height: 1.3; min-height: 34px">{{p.name}}</div>
            <div style="display: flex; align-items: baseline; gap: 6px; margin-top: 4px">
              <span style="font-size: 14px; font-weight: 800">{{p.price}}</span>
              <span style="font-size: 11px; color: #80868B; text-decoration: line-through">{{p.was}}</span>
            </div>
          </div>
        </article>
      </sc-for>
    </div>
  </section>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #FFFFFF; border-top: 1px solid #ECECEF; display: flex; align-items: flex-start; justify-content: space-around; padding-top: 10px; font-size: 11px; color: #80868B">
    <span>Home</span><span>Cart</span><span style="font-weight: 700; color: #0D0D0D">Become a Seller</span><span style="font-weight: 700; color: #00796B">Wishlist</span><span>Profile</span>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { saved: [] }; }
  renderVals() {
    const list = [
      { id: "a", name: "Demo – Burgundy Velvet Abaya with Pearls", price: "GH₵560.00", was: "GH₵690.00", off: "19% OFF", img: "/_blob/e59dbdb91e7eaf1263cb252b6f149ea8" },
      { id: "b", name: "Demo – Structured Leather Handbag", price: "GH₵690.00", was: "GH₵850.00", off: "19% OFF", img: "/_blob/cd300f5dcd562494e75f866e46fb7664" },
      { id: "c", name: "Demo – Men's Leather Jacket", price: "GH₵850.00", was: "GH₵1,050.00", off: "19% OFF", img: "/_blob/1b3b31e3246330fc38096bcdbaa2b0b1" },
      { id: "d", name: "Demo – Emerald Satin Evening Dress", price: "GH₵520.00", was: "GH₵650.00", off: "20% OFF", img: "/_blob/335d572cbb8c6ffc1267520ab3f1bc3d" }
    ];
    return {
      picks: list.map((p) => {
        const saved = this.state.saved.includes(p.id);
        return { ...p, saved, unsaved: !saved,
          toggle: () => this.setState((s) => ({ saved: saved ? s.saved.filter((x) => x !== p.id) : s.saved.concat(p.id) })) };
      })
    };
  }
}
</script>
</body>
</html>
