<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KiyuMart wishlist — proposed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}button{font-family:inherit}</style></helmet>
<div style="width: 390px; min-height: 1180px; position: relative; box-sizing: border-box; background: #F2F2F7; color: #0D0D0D; font-family: -apple-system, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, sans-serif; padding-bottom: 96px">
  <header style="display: flex; align-items: center; gap: 8px; padding: 14px 12px 10px; background: #FFFFFF">
    <button aria-label="Back" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #F2F2F7; display: grid; place-items: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D0D0D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div style="flex: 1">
      <div style="font-size: 20px; font-weight: 800">Wishlist</div>
      <div style="font-size: 12px; color: #5F6368">{{countLabel}}</div>
    </div>
  </header>

  <div style="display: flex; gap: 8px; padding: 12px 12px 4px; overflow-x: auto">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
      <button onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 12px 0">
    <sc-for list="{{items}}" as="p" hint-placeholder-count="4">
      <article style="background: #FFFFFF; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
        <div style="position: relative">
          <img src="{{p.img}}" alt="{{p.name}}" style="{{p.imgStyle}}">
          <sc-if value="{{p.hasBadge}}" hint-placeholder-val="{{ true }}"><span style="{{p.badgeStyle}}">{{p.badge}}</span></sc-if>
          <button onClick="{{p.remove}}" aria-label="Remove {{p.name}} from wishlist" style="position: absolute; top: 6px; right: 6px; width: 36px; height: 36px; border: 0; border-radius: 18px; background: rgba(255,255,255,0.92); display: grid; place-items: center; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#E53935" stroke="#E53935" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          </button>
        </div>
        <div style="padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; flex: 1">
          <div style="font-size: 11px; color: #5F6368; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.shop}}</div>
          <div style="font-size: 13px; font-weight: 600; line-height: 1.3; min-height: 34px">{{p.name}}</div>
          <div style="display: flex; align-items: baseline; gap: 6px">
            <span style="font-size: 15px; font-weight: 800">{{p.priceLabel}}</span>
            <sc-if value="{{p.hasWas}}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #80868B; text-decoration: line-through">{{p.wasLabel}}</span></sc-if>
          </div>
          <div style="flex: 1"></div>
          <sc-if value="{{p.inStock}}" hint-placeholder-val="{{ true }}">
            <button onClick="{{p.add}}" style="{{p.btnStyle}}">{{p.btnLabel}}</button>
          </sc-if>
          <sc-if value="{{p.soldOut}}" hint-placeholder-val="{{ false }}">
            <button style="margin-top: 6px; height: 36px; border: 1px solid #00796B; border-radius: 18px; background: #FFFFFF; color: #00796B; font-size: 13px; font-weight: 700; cursor: pointer">Find similar</button>
          </sc-if>
        </div>
      </article>
    </sc-for>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #FFFFFF; border-top: 1px solid #ECECEF; display: flex; align-items: flex-start; justify-content: space-around; padding-top: 10px; font-size: 11px; color: #80868B">
    <span style="text-align: center">Home</span><span style="text-align: center">Cart</span><span style="text-align: center; font-weight: 700; color: #0D0D0D">Become a Seller</span><span style="text-align: center; font-weight: 700; color: #00796B">Wishlist</span><span style="text-align: center">Profile</span>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      filter: "all",
      added: [],
      items: [
        { id: "a", name: "Demo – Burgundy Velvet Abaya with Pearls", shop: "demo seller's Store", price: 560, was: 690, stock: 3, img: "/_blob/e59dbdb91e7eaf1263cb252b6f149ea8" },
        { id: "b", name: "Demo – Structured Leather Handbag", shop: "demo seller's Store", price: 690, was: 850, stock: 8, img: "/_blob/cd300f5dcd562494e75f866e46fb7664" },
        { id: "c", name: "Demo – Men's Leather Jacket", shop: "demo seller's Store", price: 850, was: 1050, stock: 2, img: "/_blob/1b3b31e3246330fc38096bcdbaa2b0b1" },
        { id: "d", name: "Demo – Emerald Satin Evening Dress", shop: "demo seller's Store", price: 520, was: 650, stock: 0, img: "/_blob/335d572cbb8c6ffc1267520ab3f1bc3d" }
      ]
    };
  }
  renderVals() {
    const money = (n) => "GH₵" + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    const all = this.state.items;
    const f = this.state.filter;
    const shown = all.filter((i) => f === "all" || (f === "instock" && i.stock > 0));
    const defs = [["all", "All (" + all.length + ")"], ["instock", "In stock"]];
    return {
      countLabel: all.length + (all.length === 1 ? " saved item" : " saved items"),
      filters: defs.map(([k, label]) => ({
        label, pick: () => this.setState({ filter: k }),
        style: "height: 34px; padding: 0 14px; border-radius: 17px; font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer; " +
          (f === k ? "border: 1px solid #00796B; background: #00796B; color: #FFFFFF" : "border: 1px solid #E3E3E8; background: #FFFFFF; color: #3C4043")
      })),
      items: shown.map((i) => {
        const soldOut = i.stock <= 0;
        const added = this.state.added.includes(i.id);
        const off = Math.round((1 - i.price / i.was) * 100);
        return {
          ...i,
          priceLabel: money(i.price), wasLabel: money(i.was), hasWas: i.was > i.price,
          soldOut, inStock: !soldOut,
          hasBadge: soldOut || off > 0,
          badge: soldOut ? "Sold out" : off + "% OFF",
          // Same badge as the app's product cards: red "% OFF"; dark grey "Sold out".
          badgeStyle: "position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 800; letter-spacing: 0.2px; color: #FFFFFF; border-radius: 6px; padding: 3px 7px; background: " + (soldOut ? "#3C4043" : "#EF4444"),
          imgStyle: "width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; background: #F5F5F7" + (soldOut ? "; filter: grayscale(1); opacity: 0.6" : ""),
          btnLabel: added ? "Added ✓" : "Add to cart",
          btnStyle: "margin-top: 6px; height: 36px; border: 0; border-radius: 18px; font-size: 13px; font-weight: 800; cursor: pointer; " + (added ? "background: #E0F2F1; color: #00695C" : "background: #00796B; color: #FFFFFF"),
          add: () => this.setState((s) => ({ added: s.added.includes(i.id) ? s.added : s.added.concat(i.id) })),
          remove: () => this.setState((s) => ({ items: s.items.filter((x) => x.id !== i.id) }))
        };
      })
    };
  }
}
</script>
</body>
</html>
