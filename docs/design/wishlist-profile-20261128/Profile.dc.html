<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KiyuMart profile — proposed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}button{font-family:inherit}</style></helmet>
<div style="width: 390px; min-height: 1640px; position: relative; box-sizing: border-box; background: #F2F2F7; color: #0D0D0D; font-family: -apple-system, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, sans-serif; padding-bottom: 100px">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px">
    <div style="font-size: 28px; font-weight: 800; letter-spacing: -0.4px">Profile</div>
    <button aria-label="Notifications, 2 new" style="position: relative; width: 44px; height: 44px; border: 0; border-radius: 22px; background: #FFFFFF; display: grid; place-items: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D0D0D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
      <span style="position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; border-radius: 8px; background: #E53935; color: #FFFFFF; font-size: 10px; font-weight: 800; display: grid; place-items: center">2</span>
    </button>
  </header>

  <section style="margin: 6px 12px 0; background: #FFFFFF; border-radius: 20px; padding: 16px">
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 64px; height: 64px; border-radius: 32px; background: linear-gradient(135deg, #00897B, #00695C); color: #FFFFFF; display: grid; place-items: center; font-size: 22px; font-weight: 800; flex-shrink: 0">AM</div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 18px; font-weight: 800">Ama Mensah</div>
        <div style="font-size: 13px; color: #5F6368">ama@example.com</div>
        <div style="font-size: 13px; color: #5F6368">+233 24 000 0000</div>
      </div>
      <button style="height: 36px; padding: 0 14px; border: 1px solid #E3E3E8; border-radius: 18px; background: #FFFFFF; font-size: 13px; font-weight: 700; color: #0D0D0D; cursor: pointer">Edit</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px">
      <button style="border: 0; border-radius: 14px; background: #F2F8F7; padding: 12px 6px; cursor: pointer; color: #0D0D0D"><div style="font-size: 20px; font-weight: 800">3</div><div style="font-size: 12px; color: #5F6368; margin-top: 2px">Orders</div></button>
      <button style="border: 0; border-radius: 14px; background: #F2F8F7; padding: 12px 6px; cursor: pointer; color: #0D0D0D"><div style="font-size: 20px; font-weight: 800; color: #00796B">1</div><div style="font-size: 12px; color: #5F6368; margin-top: 2px">Active</div></button>
      <button style="border: 0; border-radius: 14px; background: #F2F8F7; padding: 12px 6px; cursor: pointer; color: #0D0D0D"><div style="font-size: 20px; font-weight: 800">4</div><div style="font-size: 12px; color: #5F6368; margin-top: 2px">Wishlist</div></button>
    </div>
  </section>

  <section style="margin: 12px 12px 0; background: #FFFFFF; border-radius: 20px; padding: 14px 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 15px; font-weight: 800">Active order</div>
      <span style="font-size: 11px; font-weight: 800; color: #00695C; background: #E0F2F1; border-radius: 8px; padding: 4px 8px">Packaged</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; margin-top: 12px">
      <img src="/_blob/4be356f44cd9b83e012d567a42e4971b" alt="" style="width: 52px; height: 64px; border-radius: 10px; object-fit: cover">
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 13px; font-weight: 600">Demo – Burgundy Velvet Abaya with Pearls</div>
        <div style="font-size: 12px; color: #5F6368; margin-top: 2px">demo seller's Store · 1 item</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 4px; margin-top: 14px">
      <span style="flex: 1; height: 4px; border-radius: 2px; background: #00897B"></span>
      <span style="flex: 1; height: 4px; border-radius: 2px; background: #00897B"></span>
      <span style="flex: 1; height: 4px; border-radius: 2px; background: #E3E3E8"></span>
      <span style="flex: 1; height: 4px; border-radius: 2px; background: #E3E3E8"></span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 11px; color: #5F6368; margin-top: 6px">
      <span>Processing</span><span style="color: #00796B; font-weight: 700">Packaged</span><span>On the way</span><span>Delivered</span>
    </div>
    <button style="margin-top: 14px; width: 100%; height: 44px; border: 0; border-radius: 22px; background: #00796B; color: #FFFFFF; font-size: 14px; font-weight: 800; cursor: pointer">Track order</button>
  </section>

  <section style="margin: 12px 12px 0; border-radius: 20px; padding: 14px 16px; background: linear-gradient(135deg, #E0F2F1, #F2F8F7); display: flex; align-items: center; gap: 12px">
    <div style="width: 40px; height: 40px; border-radius: 12px; background: #FFFFFF; display: grid; place-items: center; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00796B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8S10 3 7.5 4.5 9 8 12 8zm0 0s2-5 4.5-3.5S15 8 12 8z"/></svg>
    </div>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 14px; font-weight: 800">Invite friends, earn rewards</div>
      <div style="font-size: 12px; color: #3C4043">Share your referral link</div>
    </div>
    <button style="height: 34px; padding: 0 14px; border: 0; border-radius: 17px; background: #00796B; color: #FFFFFF; font-size: 12px; font-weight: 800; cursor: pointer">Copy link</button>
  </section>

  <sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
    <div style="padding: 20px 16px 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: #5F6368">{{sec.title}}</div>
    <section style="margin: 0 12px; background: #FFFFFF; border-radius: 16px; overflow: hidden">
      <sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="4">
        <button style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border: 0; border-bottom: 1px solid #F0F0F3; background: #FFFFFF; text-align: left; cursor: pointer; color: #0D0D0D">
          <span style="width: 32px; height: 32px; border-radius: 10px; background: #F2F8F7; display: grid; place-items: center; flex-shrink: 0">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#00796B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"/></svg>
          </span>
          <span style="flex: 1; min-width: 0">
            <span style="display: block; font-size: 15px; font-weight: 600">{{r.label}}</span>
            <sc-if value="{{r.hasSub}}" hint-placeholder-val="{{ false }}"><span style="display: block; font-size: 12px; color: #5F6368">{{r.sub}}</span></sc-if>
          </span>
          <sc-if value="{{r.hasRight}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #5F6368">{{r.right}}</span></sc-if>
          <sc-if value="{{r.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #00796B; color: #FFFFFF; font-size: 11px; font-weight: 800; display: grid; place-items: center">{{r.badge}}</span></sc-if>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA0A6" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </sc-for>
    </section>
  </sc-for>

  <div style="margin: 20px 12px 0">
    <button style="width: 100%; height: 50px; border-radius: 16px; background: #FFFFFF; border: 0; color: #D93025; font-size: 15px; font-weight: 700; cursor: pointer">Sign out</button>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #FFFFFF; border-top: 1px solid #ECECEF; display: flex; align-items: flex-start; justify-content: space-around; padding-top: 10px; font-size: 11px; color: #80868B">
    <span>Home</span><span>Cart</span><span style="font-weight: 700; color: #0D0D0D">Become a Seller</span><span>Wishlist</span><span style="font-weight: 700; color: #00796B">Profile</span>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1640}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      bag: "M6 7h12l-1 13H7L6 7zM9 7a3 3 0 0 1 6 0",
      heart: "M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z",
      store: "M3 9l1.5-5h15L21 9M4 9v11h16V9M3 9h18M9 20v-6h6v6",
      bike: "M5 17a3 3 0 1 0 0-.01M19 17a3 3 0 1 0 0-.01M5 17l4-8h5l3 8M9 9l-1-3H6",
      user: "M20 21a8 8 0 0 0-16 0M12 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8",
      gear: "M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.9V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 9h.1a2 2 0 1 1 0 4H21a1.7 1.7 0 0 0-1.6 2z",
      lock: "M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4",
      download: "M12 3v12M7 10l5 5 5-5M5 21h14",
      bell: "M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0",
      help: "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01",
      info: "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 16v-4M12 8h.01"
    };
    const row = (icon, label, opts = {}) => ({ icon: I[icon], label, sub: opts.sub || "", right: opts.right || "", badge: opts.badge || "",
      hasSub: !!opts.sub, hasRight: !!opts.right, hasBadge: !!opts.badge });
    return {
      sections: [
        { title: "Shopping", rows: [
          row("bag", "My orders", { sub: "1 active", badge: "1" }),
          row("heart", "Wishlist", { sub: "4 saved" }),
          row("store", "Become a seller", { sub: "Open your own shop" }),
          row("bike", "Become a rider", { sub: "Deliver and earn" })
        ] },
        { title: "Account", rows: [
          row("user", "Edit profile"),
          row("gear", "Settings", { sub: "Theme, notifications" }),
          row("lock", "Change password"),
          row("download", "Download my data")
        ] },
        { title: "Support", rows: [
          row("bell", "Notifications", { badge: "2" }),
          row("help", "Help & support"),
          row("info", "App version", { right: "1.0.0" })
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
