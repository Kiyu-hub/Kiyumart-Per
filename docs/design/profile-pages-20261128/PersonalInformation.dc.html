  </div>
  <div style="display: flex; flex-direction: column; gap: 18px; padding: 8px 24px 0">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #1A1A1A">Full name
      <span style="position: relative; display: block"><input type="text" value="Ama Mensah" style="width: 100%; box-sizing: border-box; height: 48px; border: 1px solid #D6D6D6; border-radius: 12px; padding: 0 14px 0 14px; font-size: 16px; color: #1A1A1A; background: #FFFFFF; font-family: inherit"/></span>

      <span style="position: relative; display: block"><input type="text" value="ama@example.com" readonly style="width: 100%; box-sizing: border-box; height: 48px; border: 1px solid #D6D6D6; border-radius: 12px; padding: 0 14px 0 14px; font-size: 16px; color: #6B6B6B; background: #F7F7F7; font-family: inherit"/></span><span style="font-size: 12px; color: #8A8A8A; font-weight: 400">To change your email, contact Support.</span>

    </label>
  </div>
<div style="padding: 28px 24px 0"><button style="width: 100%; height: 52px; border: 0; border-radius: 26px; background: #00796B; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer">Save changes</button></div>
