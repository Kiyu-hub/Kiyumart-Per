# Render deployment configuration
# https://render.com/docs/yaml-spec

services:
  - type: web
    name: kiyumart-api
    runtime: node
    region: frankfurt  # EU region, close to Supabase
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false  # Set to your Netlify URL, e.g. https://kiyumart.netlify.app
      - key: SETTINGS_ENCRYPTION_KEY
        sync: false  # 32-byte hex key for AES-256-GCM encryption of sensitive DB fields
      - key: KIYUMART_USE_EMBEDDED_VITE
        value: "false"
    healthCheckPath: /api/health
